name: Cap nhat may chu giong
on:
  workflow_dispatch:
jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Cau hinh (AI cua Cloudflare + Smart Placement)
        run: |
          cat > wrangler.toml <<'TOML'
          name = "giong-google"
          main = "giong-google.js"
          compatibility_date = "2024-11-01"
          keep_vars = true

          [ai]
          binding = "AI"

          [placement]
          mode = "smart"
          TOML
          cat wrangler.toml
      - name: Dua may chu giong (giong-google) len Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: b3258f4c09eb4e9122d7639252b680b8
          command: deploy
