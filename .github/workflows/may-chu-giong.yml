name: Cap nhat may chu giong
on:
  workflow_dispatch:
jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Dua may chu giong (giong-google) len Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: b3258f4c09eb4e9122d7639252b680b8
          command: deploy giong-google.js --name giong-google --compatibility-date 2026-10-29 --keep-vars
